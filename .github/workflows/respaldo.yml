name: Respaldo de datos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  respaldo:
    name: Foto de datos en Supabase Storage
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Crear foto en el bucket privado
        run: npm run respaldo -- crear
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
