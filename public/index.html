<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Iniciar sesión · Los Extras</title>
    <link rel="stylesheet" href="/css/styles.css">
    <!-- PWA pendiente: manifest e iconos en /pwa/, a cargo del usuario. -->
    <script type="module" src="/js/login.js"></script>
  </head>
  <body class="login-page">
    <main class="login">
      <div class="login__intro">
        <h1>Bienvenido a la aplicación de<br>Bancoagrícola</h1>
      </div>

      <form id="login-form" class="login__form" novalidate>
        <label>Usuario<input name="username" autocomplete="off" autocapitalize="none" spellcheck="false" required aria-describedby="login-error"></label>
        <label>Clave<input name="password" type="password" autocomplete="off" required aria-describedby="login-error"></label>
        <p id="login-error" class="error" role="alert"></p>
        <button type="submit">Ingresar</button>
      </form>

    </main>
    <noscript>Activa JavaScript para usar la aplicación.</noscript>
  </body>
</html>
