<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="4096" viewBox="112 90 450 450" role="img" aria-labelledby="title desc">
  <title id="title">Alcancía, ilustración vectorial</title>
  <desc id="desc">Dibujo lineal negro de una alcancía de cerdito con hocico, oreja, ojo circular, ranura, patas y cola.</desc>
  <rect x="112" y="90" width="450" height="450" fill="#fff"/>
  <g fill="#ffffff" stroke="#252525" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Cola curvada detrás del cuerpo. -->
    <path d="M 470 315 C 490 314, 508 304, 509 280 L 509 275" fill="none"/>
    <!-- Patas que emergen de la silueta. -->
    <path d="M 254 409 L 254 444 L 273 444 L 273 417 Z" stroke="none" fill="#252525"/>
    <path d="M 284 415 L 284 444 L 302 444 L 302 416 Z" stroke="none" fill="#252525"/>
    <path d="M 379 416 L 379 444 L 396 444 L 396 413 Z" stroke="none" fill="#252525"/>
    <path d="M 408 407 L 408 444 L 426 444 L 426 398 Z" stroke="none" fill="#252525"/>
    <!-- Cuerpo con hocico y oreja. -->
    <path d="M 214 370
             L 187 370
             C 172 370, 163 359, 163 345
             L 163 279
             L 209 279
             C 211 263, 221 244, 235 234
             L 235 170
             L 250 170
             C 272 171, 285 186, 288 203
             L 361 203
             C 426 203, 472 246, 473 307
             C 477 368, 438 416, 380 416
             L 289 416
             C 255 415, 230 399, 214 370
             Z"/>
  </g>
  <!-- Ojo en forma de aro. -->
  <circle cx="256" cy="280" r="18" fill="#ffffff" stroke="#252525" stroke-width="13"/>
  <!-- Ranura para monedas. -->
  <rect x="320" y="235" width="51" height="17" rx="2" fill="#252525"/>
</svg>
