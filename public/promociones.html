<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Para ti · Los Extras</title>
    <script src="/js/arranque.js"></script>
    <link rel="stylesheet" href="/css/inicio.css">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/fuentes.css">
    <link rel="stylesheet" href="/css/carga.css">
    <link rel="stylesheet" href="/css/promociones-sistema.css">
    <link rel="stylesheet" href="/css/promociones.css">
    <script type="module" src="/js/promociones.js"></script>
    <link rel="manifest" href="/pwa/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon.png?v=sv-1">
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icono-192.png?v=sv-1">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Bancoagrícola">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="/pwa/pwa.css">
    <script type="module" src="/pwa/pwa.js"></script>
  </head>
  <body class="promotions-page pr" data-session="pending">
    <div class="entry-loading module-loading" role="status" aria-label="Cargando acceso a promociones"><img class="loading-ring" src="/recursos/menu/carga.svg" alt=""><span>CARGANDO...</span></div>
    <header>
      <a class="pr-volver" href="/menu.html" aria-label="Volver al menú"></a>
      <img class="brand-logo" src="/recursos/bancoagricola-logo.svg" alt="Bancoagrícola">
      <div class="header-row">
        <p>Los Extras</p>
        <p id="session-profile" class="session-profile" hidden></p>
      </div>
    </header>
    <main>
      <!-- Sistema visual: cabecera de la sección. Cerca de ti (H8) se muestra cuando su pantalla exista. -->
      <section class="pr-hero">
        <div class="pr-hero__barra">
          <h1>Para ti</h1>
          <a class="pr-icono pr-icono--guardadas" href="/guardadas.html" aria-label="Guardadas"><span id="pr-contador-guardadas" class="pr-contador" hidden></span></a>
          <a class="pr-icono pr-icono--preferencias" href="/preferencias.html" aria-label="Mis preferencias"></a>
        </div>
        <nav class="pr-secciones" aria-label="Secciones de Promociones">
          <a href="/promociones.html" aria-current="page">Para ti</a>
          <a href="/cerca-de-ti.html" hidden>Cerca de ti</a>
        </nav>
        <div class="pr-buscador">
        <!-- H10: búsqueda temporal por nombre de comercio sobre el catálogo aplicable. -->
        <div id="search-box" class="search-box" role="search">
          <label for="merchant-search" class="search-label">Buscar comercio</label>
          <div class="search-field">
            <input id="merchant-search" type="search" class="search-input" placeholder="Buscar comercio" autocomplete="off" maxlength="100">
            <button id="clear-search" type="button" class="search-clear" aria-label="Limpiar búsqueda" hidden>Limpiar</button>
          </div>
        </div>
        <button id="abrir-filtros" type="button" class="pr-boton-filtros" aria-label="Filtros" aria-haspopup="dialog" aria-controls="filtros" data-activos="0"></button>
        </div>
        <!-- H25: intención del día («Hoy busco»). Tira de la cabecera que reordena sin filtrar y vive solo durante la visita. -->
        <div id="intent-box" class="pr-hoy" hidden>
          <p id="intent-label" class="visualmente-oculto">Hoy busco</p>
          <div id="intent-filter" class="pr-hoy__tira" role="radiogroup" aria-labelledby="intent-label"></div>
          <p id="intent-status" class="pr-hoy__estado" role="status" hidden></p>
        </div>
      </section>
      <!-- Franja de avisos: no repite tarjetas de la lista (js/franja.js, js/carrusel.js). -->
      <section id="franja" class="pr-franja" aria-roledescription="carrusel" aria-label="Avisos para ti" hidden></section>
      <!-- Solo los filtros activos, como píldoras que se quitan con un toque. -->
      <div id="filtros-activos" class="pr-pildoras" role="group" aria-label="Filtros activos" hidden></div>
      <p id="pr-conteo" class="pr-conteo" aria-live="polite"></p>
      <p id="saved-status" class="error" role="alert"></p>
      <div id="promotions-loading" class="pr-esqueleto" role="status" aria-label="Cargando promociones" hidden>
        <div class="pr-esqueleto__tarjeta" aria-hidden="true"></div>
        <div class="pr-esqueleto__tarjeta" aria-hidden="true"></div>
      </div>
      <!-- Estado vacío o de error; se oculta mientras #list-status está vacío. -->
      <section class="pr-estado">
        <p id="list-status" class="note" role="status"></p>
        <button id="retry" class="secondary" hidden>Reintentar</button>
        <div class="empty-actions">
          <button id="clear-search-empty" type="button" class="secondary" hidden>Limpiar búsqueda</button>
          <button id="show-all" type="button" class="secondary" hidden>Ver todas</button>
          <button id="exit-today" type="button" class="secondary" hidden>Quitar Disponibles hoy</button>
          <a id="empty-preferences" class="button secondary" href="/preferencias.html" hidden>Cambiar mis preferencias</a>
        </div>
      </section>
      <div id="cards" class="promo-list"></div>
      <template id="promotion-card">
        <article class="promo-item">
          <a class="promo-card">
            <div class="promo-media">
              <img class="promo-photo" width="960" height="540" loading="lazy" decoding="async" alt="">
              <div class="merchant-mark"><img class="merchant-logo" alt="" loading="lazy"></div>
              <span class="promo-exclusive" hidden></span>
              <p class="promo-benefit"></p>
            </div>
            <div class="promo-content">
              <div class="promo-cabeza">
                <h2></h2>
                <p class="promo-category"></p>
              </div>
              <p class="promo-reason" hidden></p>
              <p class="promo-description"></p>
              <p class="promo-cuando"></p>
              <p class="promo-validity"></p>
              <p class="promo-ending" hidden></p>
              <p class="promo-expired" hidden>Vencida</p>
              <p class="promo-badges" hidden></p>
              <ul class="promo-conditions"></ul>
              <div class="promo-pie">
                <div class="promo-tarjetas">
                  <p class="promo-applicability"></p>
                  <p class="promo-otras" hidden></p>
                </div>
                <span class="promo-open">Ver promoción</span>
              </div>
            </div>
          </a>
          <button type="button" class="guardar-promo" data-guardada="no">Guardar</button>
          <p class="error guardar-error" role="alert"></p>
        </article>
      </template>
      <!-- Hoja Filtros: tarjeta (H16), categoría (H5) y aplica hoy (H17). Los cambios se aplican al tocarlos. -->
      <dialog id="filtros" class="pr-hoja" aria-labelledby="filtros-titulo">
        <div class="pr-hoja__asa" aria-hidden="true"></div>
        <h2 id="filtros-titulo" class="pr-hoja__titulo">Filtros</h2>
        <div class="pr-hoja__cuerpo">
          <section class="pr-hoja__grupo">
            <h3>Tarjeta</h3>
            <section id="card-choice" class="card-choice" hidden>
              <p id="card-choice-label" class="card-choice-label">Ver beneficios de</p>
              <div id="card-options" class="card-options" role="group" aria-labelledby="card-choice-label"></div>
            </section>
            <p id="card-single" class="card-single" hidden></p>
          </section>
          <section class="pr-hoja__grupo">
            <h3 id="grupo-categoria">Categoría</h3>
            <div id="category-filter" class="category-filter" role="group" aria-labelledby="grupo-categoria">
              <button type="button" class="filter-chip" data-category="" aria-pressed="true">Todas</button>
            </div>
          </section>
          <section class="pr-hoja__grupo">
            <h3>Cuándo</h3>
            <button id="today-filter" type="button" class="today-filter" aria-pressed="false">Solo lo que aplica hoy</button>
          </section>
        </div>
        <div class="pr-hoja__acciones"><button id="cerrar-filtros" type="button">Listo</button></div>
      </dialog>
      <div id="pr-aviso" class="pr-aviso" role="status" hidden><p class="pr-aviso__texto"></p><button type="button" class="pr-aviso__accion">Deshacer</button></div>
    </main>
    <noscript>Activa JavaScript para usar la aplicación.</noscript>
  </body>
</html>
