<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <script src="/js/arranque.js"></script>
    <link rel="stylesheet" href="/css/inicio.css">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Mis preferencias · Los Extras</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/fuentes.css">
    <link rel="stylesheet" href="/css/carga.css">
    <link rel="stylesheet" href="/css/promociones-sistema.css">
    <link rel="stylesheet" href="/css/promociones.css">
    <script type="module" src="/js/preferencias.js"></script>
    <link rel="manifest" href="/pwa/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/pwa/apple-touch-icon.png?v=sv-1">
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icono-192.png?v=sv-1">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Bancoagrícola">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="/pwa/pwa.css">
    <script type="module" src="/pwa/pwa.js"></script>
  </head>
  <body class="preferences-page pr" data-session="pending">
    <div class="entry-loading module-loading" role="status" aria-label="Cargando acceso"><img class="loading-ring" src="/recursos/menu/carga.svg" alt=""><span>CARGANDO...</span></div>
    <header>
      <a class="pr-volver" href="/promociones.html" aria-label="Volver a Para ti"></a>
      <img class="brand-logo" src="/recursos/bancoagricola-logo.svg" alt="Bancoagrícola">
      <p id="session-profile" class="session-profile" hidden></p>
    </header>
    <main>
      <section class="pr-hero">
        <div class="pr-hero__barra">
          <h1>Mis preferencias</h1>
          <a class="pr-icono pr-icono--guardadas" href="/guardadas.html" aria-label="Guardadas"><span id="pr-contador-guardadas" class="pr-contador" hidden></span></a>
          <a class="pr-icono pr-icono--preferencias" href="/preferencias.html" aria-label="Mis preferencias" aria-current="page"></a>
        </div>
      </section>
      <p id="preferences-status" class="note" role="status">Cargando preferencias…</p>
      <button id="retry" class="secondary" type="button" hidden>Reintentar</button>
      <form id="preferences-form" hidden>
        <fieldset>
          <legend>Elige una o varias categorías</legend>
          <div id="category-options"></div>
        </fieldset>
        <p id="preferences-error" class="error" role="alert"></p>
        <div class="pr-acciones-form">
          <a id="cancel-preferences" class="button secondary" href="/promociones.html">Cancelar</a>
          <button id="save-preferences" type="submit">Guardar cambios</button>
        </div>
      </form>
    </main>
    <noscript>Activa JavaScript para usar la aplicación.</noscript>
  </body>
</html>
