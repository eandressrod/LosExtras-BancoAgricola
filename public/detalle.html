<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Detalle · Los Extras</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="/css/promociones.css">
    <!-- PWA pendiente: manifest e iconos en /pwa/, a cargo del usuario. -->
    <script type="module" src="/js/detalle.js"></script>
  </head>
  <body class="detail-page" data-session="pending">
    <header>
      <img class="brand-logo" src="/recursos/bancoagricola-logo.svg" alt="Bancoagrícola">
      <div class="header-row">
        <p>Los Extras</p>
        <p id="session-profile" class="session-profile" hidden></p>
      </div>
    </header>
    <main>
      <p id="detail-status" class="note" role="status">Cargando detalle…</p>
      <button id="retry" class="secondary" hidden>Reintentar</button>
      <div id="detail" hidden>
        <div class="promo-media detail-media">
          <img id="promotion-image" class="promo-photo" width="960" height="540" alt="">
          <div class="merchant-mark"><img id="merchant-logo" class="merchant-logo" alt=""></div>
        </div>
        <div class="detail-content">
          <span id="exclusive" class="exclusive-label" hidden>Exclusiva Black</span>
          <h1>Promoción</h1>
          <p id="benefit" class="detail-benefit"></p>
          <p id="description" class="detail-description"></p>
          <p id="payment" class="promo-applicability"></p>
          <p id="validity" class="promo-validity"></p>
          <ul id="conditions" class="promo-conditions"></ul>
        </div>
      </div>
      <div class="actions"><a id="back-to-list" class="button secondary" href="/promociones.html">Volver al listado</a></div>
    </main>
    <noscript>Activa JavaScript para usar la aplicación.</noscript>
  </body>
</html>
