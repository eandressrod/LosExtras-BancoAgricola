<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Banco Agrícola</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/menu.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Header -->
    <header class="ba-header">
      <div class="ba-logo">
        <div class="ba-logo-bar b1"></div>
        <div class="ba-logo-bar b2"></div>
        <div class="ba-logo-bar b3"></div>
      </div>
      <div class="ba-header-actions">
        <button class="action-btn-header" aria-label="Mensajería">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
          <span class="badge-counter">613</span>
          <span>Mensajería</span>
        </button>
        <button class="action-btn-header" id="btn-logout" aria-label="Cerrar sesión">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          <span>Salir</span>
        </button>
      </div>
    </header>

    <!-- Alerta de Logout Fallido -->
    <div id="alerta-logout" class="alerta-logout-fallido">
      No se pudo cerrar la sesión de forma segura. Intenta nuevamente.
    </div>

    <!-- Saludo y Perfil -->
    <section class="user-greeting-section">
      <div class="avatar-circle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <div class="greeting-info">
        <h2 id="greeting-title">Hola Samuel <span class="arrow">&gt;</span></h2>
        <p id="greeting-visita">Última visita: 09/10/2026 | 13:40</p>
      </div>
    </section>

    <!-- Sección Mis Cuentas -->
    <section>
      <div class="section-header-row">
        <div class="section-header-left">
          <h3 class="section-title">Mis cuentas</h3>
          <button class="btn-eye-toggle" id="btn-eye-toggle" aria-label="Ocultar o mostrar saldo">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <a href="#" class="link-ver-todas">Ver todas &gt;</a>
      </div>

      <!-- Carrusel de Cuentas -->
      <div class="cuentas-carousel" id="cuentas-carousel">
        <div class="cuenta-item-card">
          <div class="cuenta-item-top">
            <span>Cargando cuentas...</span>
          </div>
        </div>
      </div>
    </section>

    <!-- Fila Mis Tarjetas -->
    <div class="tarjetas-entry-card" id="btn-mis-tarjetas">
      <div class="tarjetas-entry-left">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
        <span>Mis Tarjetas</span>
      </div>
      <span style="color: #6b7280; font-size: 18px;">&gt;</span>
    </div>

    <!-- ¿Qué necesitas hacer hoy? -->
    <section class="section-actions-container">
      <h3 class="actions-subtitle">¿Qué necesitas hacer hoy?</h3>
      <div class="quick-actions-grid">
        <div class="action-circle-item">
          <div class="action-circle pink">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 11l-5-5-5 5"></path><path d="M12 18V6"></path><circle cx="12" cy="12" r="9"></circle></svg>
          </div>
          <span class="action-label">Transferir<br>dinero</span>
        </div>
        <div class="action-circle-item">
          <div class="action-circle teal">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
          </div>
          <span class="action-label">Recargar<br>celular</span>
        </div>
        <div class="action-circle-item">
          <div class="action-circle yellow">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
          </div>
          <span class="action-label">Pagar<br>tarjeta</span>
        </div>
        <div class="action-circle-item">
          <div class="action-circle gray">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          </div>
          <span class="action-label">Pagar<br>servicios</span>
        </div>
      </div>
    </section>

    <!-- Banner Promociones y descuentos (Criterio H2) -->
    <div class="promociones-entry-card" id="btn-promociones">
      <div class="promociones-entry-left">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#f97316" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        <span>Promociones y descuentos</span>
      </div>
      <span style="color: #6b7280; font-size: 18px;">&gt;</span>
    </div>

    <!-- Bottom Navigation Fijo -->
    <nav class="bottom-nav-bar">
      <button class="nav-tab-item active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
        <span>Inicio</span>
      </button>
      <button class="nav-tab-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="22" height="16" rx="2"></rect><line x1="1" y1="10" x2="23" y2="10"></line></svg>
        <span>Mis Productos</span>
      </button>
      <div class="floating-qr-wrapper">
        <button class="floating-qr-btn" aria-label="Escanear QR">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect><circle cx="17.5" cy="17.5" r="2.5"></circle></svg>
        </button>
      </div>
      <button class="nav-tab-item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        <span>Gestiones</span>
      </button>
      <button class="nav-tab-item" id="btn-tab-parati">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 12v10H4V12"></path><path d="M2 7h20v5H2z"></path><path d="M12 22V7"></path><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>
        <span>Para Ti</span>
      </button>
    </nav>
  </div>

  <script type="module" src="/js/menu.js"></script>
</body>
</html>
