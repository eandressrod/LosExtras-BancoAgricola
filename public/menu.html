<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Banco Agrícola - Menú Principal</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/menu.css">
</head>
<body>
  <header class="menu-header">
    <h1>Banco Agrícola</h1>
    <button id="btn-logout" class="btn-logout">Cerrar sesión</button>
  </header>

  <main class="menu-container">
    <!-- Estado de Carga -->
    <div id="estado-cargando" class="estado-box">
      <p>Cargando información de tus cuentas...</p>
    </div>

    <!-- Estado de Error -->
    <div id="estado-error" class="estado-box" style="display: none;">
      <p id="error-texto" style="color: #b91c1c;">No se pudieron cargar los datos.</p>
      <button id="btn-reintentar">Reintentar</button>
    </div>

    <!-- Contenido Principal -->
    <div id="contenido-menu" style="display: none;">
      <section class="welcome-card">
        <h2 id="usuario-nombre">Bienvenido</h2>
        <span id="badge-tarjeta" class="badge-perfil">Básica</span>
      </section>

      <!-- Botón visible hacia Promociones -->
      <section class="banner-promociones">
        <h3>Módulo de Promociones</h3>
        <p>Descubre los beneficios y descuentos diseñados para ti</p>
        <button id="btn-promociones" class="btn-promociones">Ver Promociones</button>
      </section>

      <!-- Listado de Cuentas -->
      <h3 class="section-title">Mis Cuentas y Tarjetas</h3>
      <div id="cuentas-vacias" class="estado-box" style="display: none;">
        <p style="color: #64748b;">No tienes cuentas registradas en este perfil.</p>
      </div>
      <div id="cuentas-list" class="cuentas-list"></div>
    </div>
  </main>

  <script type="module" src="/js/menu.js"></script>
</body>
</html>
