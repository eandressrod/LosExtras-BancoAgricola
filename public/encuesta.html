<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Tus intereses · Los Extras</title>
    <link rel="stylesheet" href="/css/styles.css">
    <!-- PWA pendiente: manifest e iconos en /pwa/, a cargo del usuario. -->
    <script type="module" src="/js/encuesta.js"></script>
  </head>
  <body>
    <header>
      <img class="brand-logo" src="/recursos/bancoagricola-logo.svg" alt="Bancoagrícola">
      <p>Los Extras</p>
    </header>
    <main>
      <h1>Tus intereses</h1>
      <p>Antes de ver promociones por primera vez, cuéntanos qué te interesa.</p>
      <form id="survey-form">
        <fieldset>
          <legend>Elige una o varias categorías</legend>
          <label class="option"><input type="checkbox" name="category" value="Restaurantes">Restaurantes</label>
          <label class="option"><input type="checkbox" name="category" value="Compras">Compras</label>
          <label class="option"><input type="checkbox" name="category" value="Entretenimiento">Entretenimiento</label>
        </fieldset>
        <p id="survey-error" class="error" role="alert"></p>
        <button type="submit">Guardar y ver promociones</button>
        <a class="button secondary" href="/promociones.html">Omitir por ahora</a>
        <a class="button secondary" href="/menu.html">Volver al menú</a>
      </form>
    </main>
    <noscript>Activa JavaScript para usar la aplicación.</noscript>
  </body>
</html>
